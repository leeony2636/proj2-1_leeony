# 필수 조건 2 — `docker compose up` 한 줄로 전체 서비스가 떠야 합니다.
# 필요 없는 서비스는 지우고, 필요한 것(redis 등)은 추가하세요.
services:
  api:
    build: .
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MCP_CLIENT_TRANSPORT: streamable-http
      MCP_SERVER_URL: http://mcp:8001/mcp
      MCP_CLIENT_TIMEOUT_SECONDS: "10"
      RUNTIME_REPOSITORY: postgres
      DATABASE_URL: postgresql://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_healthy
    # Apple Silicon에서 이미지가 안 뜨면 아래 주석을 해제해 보세요
    # platform: linux/amd64

  mcp:
    build: .
    command: ["python", "-m", "mcp_server.server"]
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      MCP_SERVER_TRANSPORT: streamable-http
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "8001"
      RUNTIME_REPOSITORY: postgres
      DATABASE_URL: postgresql://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8001), 2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
